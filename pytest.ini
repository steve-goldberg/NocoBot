[pytest]
# Repo-wide pytest configuration.
#
# Before this file existed, pytest found no configfile when invoked from the
# repo root, so the `asyncio_mode = "auto"` in nocobot/pyproject.toml was never
# applied and the session ran under Mode.STRICT. Async tests only worked
# because every one of them carried an explicit @pytest.mark.asyncio marker --
# an unmarked async test would have been silently skipped rather than failing.
#
# Declaring the mode here makes it apply to the whole repo, including
# nocodb/mcpserver/mcpserver_test.py. Existing explicit markers remain valid
# (they are redundant under auto mode, not harmful).
asyncio_mode = auto

# Both patterns are pytest defaults; stated explicitly because this repo
# colocates tests as *_test.py while tests/ uses test_*.py.
python_files = *_test.py test_*.py

# testpaths is deliberately NOT set: tests/ is gitignored (.gitignore:15) and
# is absent from a fresh clone, so naming it here would break collection for
# anyone who does not have it locally.
