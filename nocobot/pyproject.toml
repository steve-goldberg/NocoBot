[project]
name = "nocobot"
version = "0.1.0"
description = "NocoDB Telegram Agent powered by MCP"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "nocobot contributors"}
]
keywords = ["nocodb", "telegram", "mcp", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "python-telegram-bot[socks]>=21.0",
    "litellm>=1.0.0,<1.82.7",
    # Floor is the tested version, capped below the next major: an unbounded
    # mcp>=1.0.0 here is what broke the bot when the SDK went to 2.x.
    "fastmcp>=4.0.5,<5",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "loguru>=0.7.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[project.scripts]
nocobot = "nocobot.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nocobot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
